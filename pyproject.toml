[project]
name = "content-creation"
version = "0.1.0"
description = "Upload-first AI metadata and social publishing studio"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0",
    "bcrypt>=4.0.0",
    "boto3>=1.40.46",
    "email-validator>=2.3.0",
    "fastapi>=0.104.0",
    "google-api-python-client>=2.184.0",
    "google-auth>=2.41.1",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "openai>=1.50.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.0",
    "pyngrok>=7.4.0",
    "python-dotenv>=1.1.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "src/content_creation", "src/managers", "src/platform_uploaders"]
